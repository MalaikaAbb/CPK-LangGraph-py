[project]
name = "langgraph-python-test-suite-backend"
version = "0.1.0"
description = "LangGraph graphs backing the CopilotKit + LangGraph (Python) test suite"
requires-python = ">=3.10,<3.15"

# The Quickstart's own install line, plus the packages individual doc pages add:
#   uv add langgraph copilotkit langchain-openai langchain-core python-dotenv
#   uv add ag-ui-langgraph fastapi uvicorn copilotkit        (FastAPI tab)
#
# `langchain` is here because almost every page past the Quickstart builds its
# agent with `langchain.agents.create_agent` rather than a hand-rolled
# StateGraph. `langgraph-cli` is the LangSmith tab's `langgraph dev`.
dependencies = [
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "copilotkit>=0.1.94",
    "ag-ui-langgraph>=0.0.42",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Only needed for the LangSmith / LangGraph-Platform transport (`langgraph dev`).
langsmith = ["langgraph-cli[inmem]>=0.1.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
